name: 构建安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: CodexGatewayControl-win-x64
          path: release/*.exe

  macos-intel:
    name: macOS Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run package:mac:intel
      - uses: actions/upload-artifact@v4
        with:
          name: CodexGatewayControl-mac-x64
          path: release/*.dmg

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run package:mac:arm64
      - uses: actions/upload-artifact@v4
        with:
          name: CodexGatewayControl-mac-arm64
          path: release/*.dmg
